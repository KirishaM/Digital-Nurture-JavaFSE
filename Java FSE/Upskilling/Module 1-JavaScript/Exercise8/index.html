<!DOCTYPE html>
<html>
<head>
    <title>Event Handling</title>
</head>
<body>

    <h1>Community Event Portal</h1>

    <!-- Register Button -->
    <button id="registerBtn">Register</button>

    <p id="message"></p>

    <!-- Category Filter -->
    <h3>Filter Events</h3>
    <select id="category">
        <option value="All">All</option>
        <option value="Music">Music</option>
        <option value="Food">Food</option>
    </select>

    <p id="filterResult"></p>

    <!-- Search Box -->
    <h3>Search Event</h3>
    <input type="text" id="searchBox" placeholder="Enter event name">

    <p id="searchResult"></p>

    <script src="script.js"></script>

</body>
</html>
