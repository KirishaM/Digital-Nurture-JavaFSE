<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Community Event Gallery</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
}

table{
    width: 100%;
    border-collapse: collapse;
}

td{
    padding: 10px;
    text-align: center;
}

.imgBorder{
    width: 300px;
    height: 200px;
    border: 2px solid black;
}

caption{
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 15px;
}
</style>

</head>
<body>

<table border="1">
<caption>Community Event Gallery</caption>

<tr>
<td>
<img src="img1.jpg" alt="Sports Day" title="Sports Day" class="imgBorder">
<p>Sports Day</p>
</td>

<td>
<img src="img2.jpg" alt="Music Festival" title="Music Festival" class="imgBorder">
<p>Music Festival</p>
</td>

<td>
<img src="img3.jpg" alt="Food Fair" title="Food Fair" class="imgBorder">
<p>Food Fair</p>
</td>
</tr>

<tr>
<td>
<img src="img4.jpg" alt="Marathon" title="Marathon" class="imgBorder">
<p>Marathon</p>
</td>

<td>
<img src="img5.jpg" alt="Dance Show" title="Dance Show" class="imgBorder">
<p>Dance Show</p>
</td>

<td>
<img src="img6.jpg" alt="Exhibition" title="Exhibition" class="imgBorder">
<p>Exhibition</p>
</td>
</tr>

</table>

</body>
</html>
