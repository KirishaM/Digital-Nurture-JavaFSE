<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Invite</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f4f4f4;
}

h2{
    color: #333;
}

video{
    width: 800px;
    max-width: 100%;
    border: 3px solid black;
}

#message{
    font-size: 18px;
    font-weight: bold;
    color: green;
    margin-top: 10px;
}
</style>

<script>
function videoReady() {
    document.getElementById("message").innerHTML =
    "Video Ready to Play";
}

window.onbeforeunload = function() {
    return "Are you sure you want to leave this page?";
};
</script>

</head>

<body>

<h2>Community Event Video Invite</h2>

<video controls oncanplay="videoReady()">
    <source src="event.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<p id="message"></p>

</body>
</html>
